        <hr>
        <h1>Register</h1>
        <form action="javascript:register(document.getElementById('name').value, document.getElementById('email').value, document.getElementById('password').value)" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="berto" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="berto@example.com" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" value="123321" required>
            <br>
            <input type="submit" value="Register">
        </form>
    </body>
</html>
