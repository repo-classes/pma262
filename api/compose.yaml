name: store

services:

  lb:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - $SETUP/lb/nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres:18.6
    hostname: db
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    volumes:
      - $DATA/postgres:/var/lib/postgresql/18/docker
  
  account:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: store
      DATABASE_USERNAME: store
      DATABASE_PASSWORD: store
    deploy:
      replicas: 1

  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    deploy:
      replicas: 1

  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    # ports:
    #   - 9090:9090 // access from grafana
    volumes:
      - $SETUP/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana-enterprise
    hostname: grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - $SETUP/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources